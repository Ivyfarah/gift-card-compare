name: Gift Card Compare Daily Refresh

on:
  push:
    branches: [main]
  schedule:
    # 8 AM PST or 9 AM PDT in California; GitHub schedules may be delayed.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gift-card-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose direct seller public pages (temporary)
        run: python scripts/probe_direct.py
      - name: Refresh public offer headlines
        run: python scripts/update_deals.py
      - name: Prepare static site
        run: touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
